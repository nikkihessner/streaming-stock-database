services:
  # -------- Postgres (DB) --------
  db:
    image: postgres:18-alpine@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [db_password]
    volumes:
      - ~/Desktop/stock_database/pgdata:/var/lib/postgresql/data/pgdata
#      - ./db/init:/docker-entrypoint-initdb.d:ro   # optional init SQL
    networks: [internal]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
#    security_opt: ["no-new-privileges:true"]
#    cap_drop: ["ALL"]
#    read_only: true
    tmpfs: ["/tmp", "/run"]

  # -------- Kafka (single-broker, KRaft) --------
  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    container_name: kafka
    networks: [internal]
    expose: ["9092"]               # internal only
    environment:
      # KRaft (no ZooKeeper)
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Single-broker dev defaults (don’t use in prod clusters)
      KAFKA_NUM_PARTITIONS: "12"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_COMPRESSION_TYPE: "zstd"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      #  Lists topics; returns 0 if broker is responding
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 3s
      retries: 1

  # -------- Schema Registry (Confluent, in-memory for dev) --------
  schema-registry:
    image: confluentinc/cp-schema-registry@sha256:385c157f9cef42aa65e5c95050d85a439bcb0c897826aeabb3e10d36127ea223
    container_name: schema-registry
    networks: [internal]
    expose:
      - "8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"

      # Single-broker KRaft store mapping (like old ZK store but via broker)
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT

      # Internal topic configs (safe for 1-node dev)
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_OPTS: "-Djava.io.tmpdir=/var/tmp"

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    # security_opt: ["no-new-privileges:true"]
    # cap_drop: ["ALL"]
    # read_only: true
    tmpfs: ["/tmp", "/run"]

  # -------- Kafka topics initializer (one-shot) --------
  kafka-topics-init:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    networks: [internal]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c '
        set -e
        echo "Waiting for Kafka to be ready..."
        for i in $(seq 1 30); do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; then
            echo "Kafka is ready"
            break
          fi
          echo "Kafka not ready yet, sleeping..."
          sleep 2
        done
        echo "Creating topics if they do not exist..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic files_to_process \
          --partitions 3 \
          --replication-factor 1 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic ohlcv_rows \
          --partitions 6 \
          --replication-factor 1 || true
        echo "Kafka topics initialized."
      '

  # -------- Kafka UI (Provectus) --------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    networks: [internal]
    ports:
      - "8081:8080"   # host -> container UI

    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"

    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 15s
      timeout: 5s
      retries: 10    

  # -------- Your Python app --------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [internal]
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./Pipfile:/app/Pipfile:ro
      - ./Pipfile.lock:/app/Pipfile.lock:ro
    environment:
      PYTHONPATH: /app/src
      APP_ENV: "local"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: appdb
      PGUSER: appuser
      PGPASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-ui:
        condition: service_healthy
    # security_opt: ["no-new-privileges:true"]
    # cap_drop: ["ALL"]
    # read_only: true
    tmpfs: ["/tmp", "/run"]
    # Runs idle so you can exec in and run scripts
    command: ["python", "-m", "stock_pipeline.file_watcher"]

secrets:
  db_password:
    file: .secrets/db_password   # keep gitignored

volumes:
  pgdata:
  kafkadata:

networks:
  internal:
    driver: bridge
